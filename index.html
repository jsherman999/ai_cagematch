<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The AI Opinion Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="plot-panel" aria-label="AI opinion map">
<header><h1><span class="live-dot"></span>THE OPINION MAP</h1><span class="sample">10 FICTIONAL PEOPLE · 2 AXES</span></header>

<p id="scores" class="sr-only"></p>
</main>
<script src="app.js"></script>
</body></html>
