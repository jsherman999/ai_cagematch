<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The AI Opinion Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="workspace" aria-label="AI opinion map"><section class="plot-panel" aria-label="The opinion map">
<header><h1><span class="live-dot"></span>THE OPINION MAP</h1><span class="sample">10 FICTIONAL PEOPLE · 2 AXES</span></header>
<div class="canvas-wrap"><canvas id="plot" tabindex="0" aria-label="AI opinion quadrants. Left: low potential. Right: high potential. Top: Pollyanna. Bottom: doomer. Click a person or use arrow keys to select them." aria-describedby="scores"></canvas></div>
<p id="scores" class="sr-only"></p>
</section>
<aside><div class="aside-heading"><h2>The people</h2><span>FICTIONAL SAMPLE</span></div><p class="aside-copy">Pick a person to see their perspective.</p><div id="people"></div><div id="detail" aria-live="polite"></div><button id="shuffle" class="shuffle">Generate a new crowd <span>↗</span></button></aside>
</main>
<script src="app.js"></script>
</body></html>
